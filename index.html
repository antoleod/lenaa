<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LénaLand · Maison des maths</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10263a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;left:18px;top:16px;background:#fffde8e8;padding:9px 15px;border-radius:18px;font-weight:900;color:#56396e;box-shadow:0 6px 18px #0002}.mission{position:absolute;right:18px;top:16px;background:#4f357de8;color:white;padding:9px 15px;border-radius:18px;font-weight:800}.speech{position:absolute;left:50%;top:7%;transform:translateX(-50%);max-width:480px;background:white;padding:13px 18px;border-radius:20px;font-weight:800;color:#49325e;box-shadow:0 8px 24px #0003;text-align:center}.answers{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}.answers button{border:3px solid #fff8;background:#fff;color:#50356f;border-radius:22px;min-width:88px;padding:14px 18px;font-size:24px;font-weight:950;box-shadow:0 7px 0 #c4addb,0 12px 22px #0003;cursor:pointer}.answers button:active{transform:translateY(5px);box-shadow:0 2px 0 #c4addb}.tip{position:absolute;bottom:94px;width:100%;text-align:center;color:white;font-weight:800;text-shadow:0 2px 4px #0008}@media(max-width:650px){.mission{top:62px}.speech{top:14%;width:86%;font-size:14px}.answers{gap:6px}.answers button{min-width:68px;padding:12px;font-size:20px}}</style>
</head><body><div id="game"></div><div class="hud"><div class="brand">✨ LénaLand · Maison des maths</div><div class="mission">Table de 5 · ⭐ <span id="stars">0</span></div><div class="speech" id="speech">Regarde : trois groupes de cinq. Touche les pommes pour compter avec moi.</div><div class="tip" id="tip">5 + 5 + 5 = ?</div><div class="answers"><button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button><button data-v="25">25</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script><script>
(async()=>{const app=new PIXI.Application();await app.init({resizeTo:window,antialias:true,resolution:Math.min(devicePixelRatio,2),autoDensity:true});document.querySelector('#game').appendChild(app.canvas);const W=()=>app.screen.width,H=()=>app.screen.height,stage=app.stage;
function box(x,y,w,h,r,c){const g=new PIXI.Graphics().roundRect(x,y,w,h,r).fill(c);stage.addChild(g);return g}function txt(s,x,y,size,c='#fff',weight='700'){const t=new PIXI.Text({text:s,style:{fontFamily:'Arial',fontSize:size,fill:c,fontWeight:weight,align:'center'}});t.anchor.set(.5);t.position.set(x,y);stage.addChild(t);return t}
const sky=new PIXI.Graphics();stage.addChild(sky);const hills=new PIXI.Graphics();stage.addChild(hills);const room=new PIXI.Container();stage.addChild(room);
const sun=new PIXI.Graphics().circle(0,0,55).fill('#ffe27a');stage.addChildAt(sun,1);sun.alpha=.85;
const cloud=[];for(let i=0;i<4;i++){const c=new PIXI.Graphics();for(let j=0;j<4;j++)c.circle(j*35,Math.sin(j)*8,28+j*3).fill('#ffffff');c.alpha=.75;c.y=80+i*42;c.x=i*260;stage.addChildAt(c,2);cloud.push(c)}
const board=box(0,0,500,280,20,'#315b49'),frame=new PIXI.Graphics();stage.addChild(frame);const eq=txt('3 × 5 = ?',0,0,48),addition=txt('5 + 5 + 5 = ?',0,0,25,'#ffeaa6');
const apples=new PIXI.Container();stage.addChild(apples);let appleItems=[];for(let g=0;g<3;g++)for(let i=0;i<5;i++){const a=new PIXI.Container(),fruit=new PIXI.Graphics().circle(0,0,15).fill('#ef4d55'),leaf=new PIXI.Graphics().ellipse(9,-15,8,4).fill('#65a94f'),stem=new PIXI.Graphics().rect(-2,-20,4,9).fill('#76502d');a.addChild(fruit,leaf,stem);a.eventMode='static';a.cursor='pointer';a._group=g;a.on('pointertap',()=>countGroup(g));apples.addChild(a);appleItems.push(a)}
const teacher=new PIXI.Container();stage.addChild(teacher);teacher.eventMode='static';teacher.cursor='pointer';teacher.on('pointertap',()=>{state='think';document.querySelector('#speech').textContent='Réfléchissons ensemble : combien font trois groupes de cinq ?';setTimeout(()=>{state='teach';document.querySelector('#speech').textContent='Touche les groupes : 5… 10… 15.'},1200)});const shadow=new PIXI.Graphics().ellipse(0,0,65,14).fill({color:'#000',alpha:.16});teacher.addChild(shadow);shadow.y=130;const legs=new PIXI.Graphics().roundRect(-42,65,30,70,14).fill('#704aa1').roundRect(12,65,30,70,14).fill('#704aa1');teacher.addChild(legs);const body=new PIXI.Graphics().roundRect(-65,-15,130,105,35).fill('#e784b4');teacher.addChild(body);const head=new PIXI.Graphics().circle(0,-80,58).fill('#f5c6a4');teacher.addChild(head);const hair=new PIXI.Graphics().arc(0,-82,62,Math.PI,Math.PI*2).stroke({width:28,color:'#593b2f'});teacher.addChild(hair);const eyeL=new PIXI.Graphics().circle(-20,-78,5).fill('#382e37'),eyeR=new PIXI.Graphics().circle(20,-78,5).fill('#382e37');teacher.addChild(eyeL,eyeR);const smile=new PIXI.Graphics().arc(0,-65,18,.15,Math.PI-.15).stroke({width:4,color:'#a64e5a'});teacher.addChild(smile);const arm=new PIXI.Graphics().roundRect(45,5,95,22,11).fill('#f5c6a4');arm.pivot.set(0,11);arm.position.set(40,10);teacher.addChild(arm);const pointer=new PIXI.Graphics().circle(140,16,8).fill('#f5c6a4');teacher.addChild(pointer);
const rug=new PIXI.Graphics();stage.addChildAt(rug,3);const motes=[];for(let i=0;i<18;i++){const m=new PIXI.Graphics().circle(0,0,1.5+Math.random()*2).fill('#fff6c7');m.alpha=.2+Math.random()*.45;m.x=Math.random()*900;m.y=Math.random()*600;stage.addChild(m);motes.push(m)}const plant=new PIXI.Container();stage.addChild(plant);plant.addChild(new PIXI.Graphics().roundRect(-28,0,56,50,12).fill('#d38b58'));for(let i=0;i<5;i++){const l=new PIXI.Graphics().ellipse(0,-35,15,45).fill(i%2?'#65b56b':'#4c9b5c');l.rotation=(i-2)*.45;l.x=(i-2)*10;plant.addChild(l)}
const spark=new PIXI.Container();stage.addChild(spark);function layout(){const w=W(),h=H();sky.clear().rect(0,0,w,h).fill('#75cdf2');hills.clear().moveTo(0,h*.55).bezierCurveTo(w*.2,h*.36,w*.35,h*.62,w*.55,h*.48).bezierCurveTo(w*.75,h*.35,w*.85,h*.55,w,h*.42).lineTo(w,h).lineTo(0,h).fill('#78bd68');sun.position.set(w*.82,h*.17);rug.clear().ellipse(w*.52,h*.77,300,85).fill('#f3b7bf');board.position.set(w*.48,h*.24);board.width=Math.min(500,w*.5);board.height=Math.min(280,h*.4);frame.clear().roundRect(board.x-10,board.y-10,board.width+20,board.height+20,25).stroke({width:12,color:'#9a673e'});eq.position.set(board.x+board.width/2,board.y+58);addition.position.set(board.x+board.width/2,board.y+board.height-45);teacher.position.set(Math.max(115,w*.18),h*.61);teacher.scale.set(Math.min(1,h/760));plant.position.set(w*.9,h*.66);const bw=board.width/3;appleItems.forEach((a,k)=>{const g=Math.floor(k/5),i=k%5;a.position.set(board.x+bw*(g+.5)+(i-2)*27,board.y+140+(i%2)*7);a.scale.set(.75)});}
layout();addEventListener('resize',layout);let time=0,blink=0,state='teach',counted=-1;function countGroup(g){counted=Math.max(counted,g);addition.text=['5','5 + 5 = 10','5 + 5 + 5 = 15'][counted];document.querySelector('#speech').textContent=counted===2?'Voilà ! 5, 10, 15. Maintenant choisis la réponse.':'Très bien. Continue : cinq de plus…';appleItems.filter(a=>a._group<=counted).forEach(a=>a.scale.set(.9));state='point'}
function celebrate(){state='celebrate';eq.text='3 × 5 = 15';document.querySelector('#stars').textContent='3';document.querySelector('#speech').textContent='Bravo ! Trois groupes de cinq font quinze !';document.querySelector('#tip').textContent='🎉 3 × 5 = 15';for(let i=0;i<28;i++){const s=txt(i%2?'★':'✦',teacher.x,teacher.y-80,18+i%12,i%3?'#ffe56b':'#fff');s._vx=(Math.random()-.5)*8;s._vy=-Math.random()*8-2;s._life=90;spark.addChild(s)}}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(b.dataset.v==='15')celebrate();else{state='help';document.querySelector('#speech').textContent='Presque ! Touche chaque groupe : 5… 10… 15.';document.querySelector('#tip').textContent='Compte les 3 groupes de 5.'}});
app.ticker.add(()=>{time+=.035;cloud.forEach((c,i)=>{c.x+=.12+i*.025;if(c.x>W()+150)c.x=-180});teacher.y+=Math.sin(time*2)*.12;arm.rotation=state==='point'||state==='teach'?-.18+Math.sin(time*3)*.04:0;if(Math.sin(time*.7)>.995){eyeL.scale.y=eyeR.scale.y=.12;blink=6}if(blink>0&&--blink===0)eyeL.scale.y=eyeR.scale.y=1;plant.rotation=Math.sin(time)*.015;motes.forEach((m,i)=>{m.y-=.08+(i%4)*.015;m.x+=Math.sin(time+i)*.08;if(m.y<20)m.y=H()*.75;if(m.x>W())m.x=0});head.scale.set(state==='think'?1.025:1);teacher.scale.x=Math.abs(teacher.scale.x)*(state==='help'?1.015:1);if(state==='celebrate')teacher.rotation=Math.sin(time*8)*.025;for(const s of [...spark.children]){s.x+=s._vx;s.y+=s._vy;s._vy+=.15;s.alpha=s._life/90;if(--s._life<=0)s.destroy()}})})();
</script></body></html>
