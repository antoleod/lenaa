<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Léna Animation Lab · Table de 5</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#92d9ff 0 48%,#a8df7c 48%);min-height:100vh;color:#30244c}.world{max-width:980px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.pill{background:#fff9;padding:9px 14px;border-radius:99px;font-weight:800}.scene{position:relative;height:430px;overflow:hidden;border-radius:34px;background:radial-gradient(circle at 22% 18%,#fff7 0 7%,transparent 22%),linear-gradient(#79cfff 0 50%,#77bc58 50%);box-shadow:0 20px 50px #36556a55}.cloud{position:absolute;font-size:70px;animation:cloud 18s linear infinite}.c2{top:65px;animation-duration:25s;animation-delay:-9s}.school{position:absolute;right:30px;bottom:70px;font-size:130px}.board{position:absolute;right:180px;top:90px;width:360px;height:220px;background:#315a46;border:12px solid #8b5a32;border-radius:14px;color:white;text-align:center;padding:18px;box-shadow:0 10px 0 #0002}.eq{font-size:48px;font-weight:900}.hint{font-size:20px}.girl{position:absolute;left:70px;bottom:55px;width:160px;text-align:center;transform-origin:50% 100%;animation:breathe 2s ease-in-out infinite}.head{font-size:82px;filter:drop-shadow(0 7px 3px #0002)}.body{font-size:70px;margin-top:-22px}.arm{position:absolute;font-size:38px;right:-15px;top:85px;transform-origin:left center;animation:point 1.2s ease-in-out infinite}.speech{position:absolute;left:205px;top:35px;background:white;border-radius:22px;padding:14px 18px;font-weight:800;max-width:220px;box-shadow:0 8px 20px #0002}.groups{display:flex;justify-content:center;gap:12px;margin-top:12px}.group{background:#fff3;border:2px solid #fff6;border-radius:12px;padding:7px;font-size:21px;cursor:pointer}.panel{margin-top:16px;background:#fff;border-radius:28px;padding:18px;box-shadow:0 12px 30px #30405a33}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.answers button{border:0;border-radius:18px;padding:17px;font-size:24px;font-weight:900;background:#f1eaff;color:#4b3474;cursor:pointer;transition:.2s}.answers button:hover{transform:translateY(-3px);background:#e3d5ff}.feedback{text-align:center;min-height:34px;font-size:20px;font-weight:800;margin-top:12px}.celebrate .girl{animation:jump .55s ease 3}.celebrate .scene:after{content:"✨ ⭐ 🎉 ✨ ⭐";position:absolute;inset:20px;text-align:center;font-size:48px;animation:spark 1.5s ease both;pointer-events:none}@keyframes cloud{from{left:-120px}to{left:105%}}@keyframes breathe{50%{transform:translateY(-5px) rotate(1deg)}}@keyframes point{50%{transform:rotate(-18deg)}}@keyframes jump{50%{transform:translateY(-45px) rotate(-4deg)}}@keyframes spark{from{opacity:0;transform:scale(.6)}50%{opacity:1}to{opacity:0;transform:scale(1.4)}}@media(max-width:700px){.scene{height:520px}.board{right:18px;top:175px;width:calc(100% - 36px);height:220px}.girl{left:18px;bottom:40px;transform:scale(.72);transform-origin:bottom left}.speech{left:145px;top:38px}.school{display:none}.answers{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="world" id="app"><div class="top"><h1>🏡 Maison des maths</h1><span class="pill">Prototype · Table de 5</span></div><section class="scene"><div class="cloud">☁️</div><div class="cloud c2">☁️</div><div class="school">🏫</div><div style="position:absolute;left:18px;bottom:5px;font-size:65px;filter:drop-shadow(0 8px 5px #0003);animation:breathe 3s infinite">🌳</div><div style="position:absolute;right:18px;bottom:5px;font-size:54px;animation:breathe 2.4s infinite">🌻🌷</div><div class="speech" id="speech">Regarde ! Je vais te montrer avec 3 groupes de 5.</div><div class="girl"><div class="head">👩🏻‍🏫</div><div class="body">🩷</div><div class="arm">👉</div></div><div class="board"><div class="eq">3 × 5 = <span id="result">?</span></div><div class="groups"><button class="group">🍎🍎🍎🍎🍎</button><button class="group">🍎🍎🍎🍎🍎</button><button class="group">🍎🍎🍎🍎🍎</button></div><div class="hint" id="hint">5 + 5 + 5 = ?</div></div></section><section class="panel"><div class="answers"><button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button><button data-v="25">25</button></div><div class="feedback" id="feedback">Choisis la réponse. Léna t'aide si tu te trompes.</div></section></main><script>
const app=document.querySelector('#app'),result=document.querySelector('#result'),feedback=document.querySelector('#feedback'),speech=document.querySelector('#speech'),hint=document.querySelector('#hint');document.querySelectorAll('.group').forEach((b,i)=>b.onclick=()=>{hint.textContent=['5','5 + 5 = 10','5 + 5 + 5 = 15'][i];speech.textContent=i===2?'Voilà : trois groupes de cinq font quinze !':'Continue à compter avec moi…'});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(b.dataset.v==='15'){result.textContent='15';feedback.textContent='🎉 Bravo ! 3 × 5 = 15';speech.textContent='Super ! Tu as trouvé toute seule !';app.classList.remove('celebrate');void app.offsetWidth;app.classList.add('celebrate')}else{feedback.textContent='Presque ! Touche les groupes de pommes et compte 5, 10, 15.';speech.textContent='Pas grave. On compte ensemble : 5… 10… puis ?';hint.textContent='5 + 5 + 5 = ?'}});</script></body></html>
